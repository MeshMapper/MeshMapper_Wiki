<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 734" width="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How MeshMapper decides a ping's type</title>
  <desc id="d">Each row shows your radio, a repeater, and an observer that feeds MeshMapper. BIDIR: your ping reached a repeater, you heard its repeat, and it reached an observer. DISC or TRACE: a repeater replied to your discovery or trace. TX: it reached an observer but you heard no repeat. RX: you heard mesh traffic without transmitting. DEAD: you heard a repeat but it never reached an observer. DROP: no repeat heard and it never reached an observer.</desc>
  <rect width="760" height="734" rx="12" fill="#0d1117"/>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker>
    <marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff7b72"/></marker>
  </defs>
  <text x="320" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">Your radio</text>
  <text x="490" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">Repeater</text>
  <text x="672" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">Observer</text>
  <text x="672" y="48" text-anchor="middle" font-size="11" fill="#9aa4b2">(feeds MeshMapper)</text>
  <!-- BIDIR -->
  <rect x="12" y="70" width="736" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="12" y="70" width="10" height="92" rx="4" fill="#1e7e34"/>
  <text x="36" y="106" font-size="17" font-weight="700" fill="#e6edf3">BIDIR</text>
  <text x="36" y="126" font-size="12" fill="#9aa4b2">Repeat heard, and it reached</text>
  <text x="36" y="141" font-size="12" fill="#9aa4b2">an observer</text>
  <line x1="356" y1="105" x2="464" y2="105" stroke="#7ee787" stroke-width="3" marker-end="url(#ok)"/>
  <line x1="464" y1="127" x2="356" y2="127" stroke="#7ee787" stroke-width="3" marker-end="url(#ok)"/>
  <line x1="516" y1="116" x2="624" y2="116" stroke="#7ee787" stroke-width="3" marker-end="url(#ok)"/>
  <rect x="288" y="98" width="64" height="36" rx="8" fill="#16301f" stroke="#7ee787" stroke-width="2"/>
  <text x="320" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">You</text>
  <circle cx="490" cy="116" r="22" fill="#1f2a36" stroke="#00d2ff" stroke-width="2"/>
  <text x="490" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">AA</text>
  <rect x="628" y="98" width="88" height="36" rx="8" fill="#1f2a36" stroke="#9aa4b2" stroke-width="2"/>
  <text x="672" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">Observer</text>
  <!-- DISC / TRACE -->
  <rect x="12" y="170" width="736" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="12" y="170" width="10" height="92" rx="4" fill="#17a2b8"/>
  <text x="36" y="206" font-size="17" font-weight="700" fill="#e6edf3">DISC / TRACE</text>
  <text x="36" y="226" font-size="12" fill="#9aa4b2">A repeater replied to your</text>
  <text x="36" y="241" font-size="12" fill="#9aa4b2">discovery or trace</text>
  <line x1="356" y1="205" x2="464" y2="205" stroke="#7ee787" stroke-width="3" marker-end="url(#ok)"/>
  <line x1="464" y1="227" x2="356" y2="227" stroke="#7ee787" stroke-width="3" marker-end="url(#ok)"/>
  <rect x="288" y="198" width="64" height="36" rx="8" fill="#16301f" stroke="#7ee787" stroke-width="2"/>
  <text x="320" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">You</text>
  <circle cx="490" cy="216" r="22" fill="#1f2a36" stroke="#00d2ff" stroke-width="2"/>
  <text x="490" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">AA</text>
  <rect x="628" y="198" width="88" height="36" rx="8" fill="#1f2a36" stroke="#9aa4b2" stroke-width="2"/>
  <text x="672" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">Observer</text>
  <!-- TX -->
  <rect x="12" y="270" width="736" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="12" y="270" width="10" height="92" rx="4" fill="#fd7e14"/>
  <text x="36" y="306" font-size="17" font-weight="700" fill="#e6edf3">TX</text>
  <text x="36" y="326" font-size="12" fill="#9aa4b2">Reached an observer, but</text>
  <text x="36" y="341" font-size="12" fill="#9aa4b2">no repeat heard back</text>
  <line x1="356" y1="305" x2="464" y2="305" stroke="#7ee787" stroke-width="3" marker-end="url(#ok)"/>
  <line x1="464" y1="327" x2="356" y2="327" stroke="#ff7b72" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#bad)"/>
  <circle cx="410.0" cy="327" r="8" fill="#0d1117" stroke="#ff7b72" stroke-width="2"/>
  <path d="M406.5,323.5 L413.5,330.5 M413.5,323.5 L406.5,330.5" stroke="#ff7b72" stroke-width="2" stroke-linecap="round"/>
  <line x1="516" y1="316" x2="624" y2="316" stroke="#7ee787" stroke-width="3" marker-end="url(#ok)"/>
  <rect x="288" y="298" width="64" height="36" rx="8" fill="#16301f" stroke="#7ee787" stroke-width="2"/>
  <text x="320" y="321" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">You</text>
  <circle cx="490" cy="316" r="22" fill="#1f2a36" stroke="#00d2ff" stroke-width="2"/>
  <text x="490" y="321" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">AA</text>
  <rect x="628" y="298" width="88" height="36" rx="8" fill="#1f2a36" stroke="#9aa4b2" stroke-width="2"/>
  <text x="672" y="321" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">Observer</text>
  <!-- RX -->
  <rect x="12" y="370" width="736" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="12" y="370" width="10" height="92" rx="4" fill="#6f42c1"/>
  <text x="36" y="406" font-size="17" font-weight="700" fill="#e6edf3">RX</text>
  <text x="36" y="426" font-size="12" fill="#9aa4b2">Heard mesh traffic</text>
  <text x="36" y="441" font-size="12" fill="#9aa4b2">without transmitting</text>
  <line x1="464" y1="427" x2="356" y2="427" stroke="#7ee787" stroke-width="3" marker-end="url(#ok)"/>
  <rect x="288" y="398" width="64" height="36" rx="8" fill="#16301f" stroke="#7ee787" stroke-width="2"/>
  <text x="320" y="421" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">You</text>
  <circle cx="490" cy="416" r="22" fill="#1f2a36" stroke="#00d2ff" stroke-width="2"/>
  <text x="490" y="421" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">AA</text>
  <rect x="628" y="398" width="88" height="36" rx="8" fill="#1f2a36" stroke="#9aa4b2" stroke-width="2"/>
  <text x="672" y="421" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">Observer</text>
  <!-- DEAD -->
  <rect x="12" y="470" width="736" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="12" y="470" width="10" height="92" rx="4" fill="#6c757d"/>
  <text x="36" y="506" font-size="17" font-weight="700" fill="#e6edf3">DEAD</text>
  <text x="36" y="526" font-size="12" fill="#9aa4b2">Repeat heard, but it never</text>
  <text x="36" y="541" font-size="12" fill="#9aa4b2">reached an observer</text>
  <line x1="356" y1="505" x2="464" y2="505" stroke="#7ee787" stroke-width="3" marker-end="url(#ok)"/>
  <line x1="464" y1="527" x2="356" y2="527" stroke="#7ee787" stroke-width="3" marker-end="url(#ok)"/>
  <line x1="516" y1="516" x2="624" y2="516" stroke="#ff7b72" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#bad)"/>
  <circle cx="574.0" cy="516" r="8" fill="#0d1117" stroke="#ff7b72" stroke-width="2"/>
  <path d="M570.5,512.5 L577.5,519.5 M577.5,512.5 L570.5,519.5" stroke="#ff7b72" stroke-width="2" stroke-linecap="round"/>
  <rect x="288" y="498" width="64" height="36" rx="8" fill="#16301f" stroke="#7ee787" stroke-width="2"/>
  <text x="320" y="521" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">You</text>
  <circle cx="490" cy="516" r="22" fill="#1f2a36" stroke="#00d2ff" stroke-width="2"/>
  <text x="490" y="521" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">AA</text>
  <rect x="628" y="498" width="88" height="36" rx="8" fill="#1f2a36" stroke="#9aa4b2" stroke-width="2"/>
  <text x="672" y="521" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">Observer</text>
  <!-- DROP -->
  <rect x="12" y="570" width="736" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="12" y="570" width="10" height="92" rx="4" fill="#bd2130"/>
  <text x="36" y="606" font-size="17" font-weight="700" fill="#e6edf3">DROP</text>
  <text x="36" y="626" font-size="12" fill="#9aa4b2">No repeat heard, and it</text>
  <text x="36" y="641" font-size="12" fill="#9aa4b2">never reached an observer</text>
  <line x1="356" y1="605" x2="464" y2="605" stroke="#ff7b72" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#bad)"/>
  <circle cx="410.0" cy="605" r="8" fill="#0d1117" stroke="#ff7b72" stroke-width="2"/>
  <path d="M406.5,601.5 L413.5,608.5 M413.5,601.5 L406.5,608.5" stroke="#ff7b72" stroke-width="2" stroke-linecap="round"/>
  <line x1="464" y1="627" x2="356" y2="627" stroke="#ff7b72" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#bad)"/>
  <circle cx="410.0" cy="627" r="8" fill="#0d1117" stroke="#ff7b72" stroke-width="2"/>
  <path d="M406.5,623.5 L413.5,630.5 M413.5,623.5 L406.5,630.5" stroke="#ff7b72" stroke-width="2" stroke-linecap="round"/>
  <line x1="516" y1="616" x2="624" y2="616" stroke="#ff7b72" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#bad)"/>
  <circle cx="574.0" cy="616" r="8" fill="#0d1117" stroke="#ff7b72" stroke-width="2"/>
  <path d="M570.5,612.5 L577.5,619.5 M577.5,612.5 L570.5,619.5" stroke="#ff7b72" stroke-width="2" stroke-linecap="round"/>
  <rect x="288" y="598" width="64" height="36" rx="8" fill="#16301f" stroke="#7ee787" stroke-width="2"/>
  <text x="320" y="621" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">You</text>
  <circle cx="490" cy="616" r="22" fill="#1f2a36" stroke="#00d2ff" stroke-width="2"/>
  <text x="490" y="621" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">AA</text>
  <rect x="628" y="598" width="88" height="36" rx="8" fill="#1f2a36" stroke="#9aa4b2" stroke-width="2"/>
  <text x="672" y="621" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">Observer</text>
  <line x1="24" y1="698" x2="64" y2="698" stroke="#7ee787" stroke-width="3" marker-end="url(#ok)"/>
  <text x="74" y="702" font-size="13" fill="#e6edf3">got through</text>
  <line x1="190" y1="698" x2="230" y2="698" stroke="#ff7b72" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#bad)"/>
  <circle cx="210.0" cy="698" r="8" fill="#0d1117" stroke="#ff7b72" stroke-width="2"/>
  <path d="M206.5,694.5 L213.5,701.5 M213.5,694.5 L206.5,701.5" stroke="#ff7b72" stroke-width="2" stroke-linecap="round"/>
  <text x="240" y="702" font-size="13" fill="#e6edf3">didn't get through</text>
  <text x="736" y="702" text-anchor="end" font-size="12" fill="#9aa4b2">Colour bar = the square's colour on the map</text>
</svg>
