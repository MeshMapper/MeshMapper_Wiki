name: Deploy MkDocs site

# A merged PR already arrives as a push to main. The old `pull_request: closed` trigger also fired on that
# merge (two deploys racing to gh-pages) and on PRs closed WITHOUT merging, which would publish unmerged content.
on:
  push:
    branches: [ main ]
  workflow_dispatch:


permissions:
  contents: write       # needed so the action can push to gh-pages

jobs:
  deploy:
    # Only main publishes: a manual run started from another branch is skipped.
    if: github.ref == 'refs/heads/main'
    # One deploy at a time (job level, so a skipped run never joins the group): a newer run waits for the
    # running one instead of racing it to gh-pages, so the latest main lands last.
    concurrency:
      group: wiki-pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install MkDocs + Material
        run: |
          pip install mkdocs-material

      - name: Install Mkdocs-plugin
        run: |
          pip install mkdocs-macros-plugin pyyaml mkdocs-glightbox pymdown-extensions

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: wiki.meshmapper.net
